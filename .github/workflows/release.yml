name: Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rust-target: x86_64-pc-windows-msvc
            msbuild-platform: x64
          - platform: ARM64
            rust-target: aarch64-pc-windows-msvc
            msbuild-platform: ARM64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Rust ${{ matrix.rust-target }}
        run: |
          rustup target add ${{ matrix.rust-target }}
          rustc --version

      - name: Rust unit tests (x64 only)
        if: matrix.platform == 'x64'
        run: cargo test --workspace

      - name: Build Rust core
        run: cargo build --release --target ${{ matrix.rust-target }} -p guardian-core

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build WinUI3 app (${{ matrix.platform }})
        run: msbuild csharp\CampusAuthGuardian.csproj /p:Configuration=Release /p:Platform=${{ matrix.msbuild-platform }} /restore /m /v:m /bl

      - name: Smoke test (x64 only, launch and verify alive)
        if: matrix.platform == 'x64'
        run: |
          $exe = "csharp\bin\x64\Release\net10.0-windows10.0.26100.0\CampusAuthGuardian.exe"
          $p = Start-Process $exe -WorkingDirectory "csharp\bin\x64\Release\net10.0-windows10.0.26100.0" -PassThru
          Start-Sleep 10
          if ($p.HasExited) { Write-Host "::warning::App exited early" } else { Write-Host "App running OK"; Stop-Process -Id $p.Id -Force }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusAuthGuardian-${{ matrix.platform }}
          path: |
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/CampusAuthGuardian.exe
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/CampusAuthGuardian.dll
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/guardian_core.dll
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/*.pri
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/Microsoft.WindowsAppRuntime.*
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/Microsoft.UI.*
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/Microsoft.Internal.*
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/CoreMessagingXP.dll
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/dcompi.dll
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/dwmcorei.dll
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/wuceffectsi.dll
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/marshal.dll
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/DWriteCore.dll
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/WinUIEdit.dll
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/MRM.dll
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/DirectManipulation*
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/zh-CN/*
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/en-us/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Zip per-platform
        shell: pwsh
        run: |
          Compress-Archive -Path "release/CampusAuthGuardian-x64/*" -DestinationPath "CampusAuthGuardian-windows-x64.zip" -Force
          Compress-Archive -Path "release/CampusAuthGuardian-ARM64/*" -DestinationPath "CampusAuthGuardian-windows-ARM64.zip" -Force
          Get-Item *.zip | Select-Object Name, Length

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
