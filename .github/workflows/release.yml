name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake (x64)
        run: cmake -B build-x64 -A x64

      - name: Build (x64)
        run: cmake --build build-x64 --config Release

      - name: Configure CMake (ARM64)
        run: cmake -B build-arm64 -A ARM64

      - name: Build (ARM64)
        run: cmake --build build-arm64 --config Release

      - name: Package x64
        shell: pwsh
        run: |
          $dir = "dist-x64"
          New-Item -ItemType Directory -Force -Path $dir
          Copy-Item "build-x64\Release\CampusAuthGuardian.exe" "$dir\"
          Copy-Item "README.md" "$dir\"
          Compress-Archive -Path "$dir\*" -DestinationPath "CampusAuthGuardian-windows-x64.zip" -Force

      - name: Package ARM64
        shell: pwsh
        run: |
          $dir = "dist-arm64"
          New-Item -ItemType Directory -Force -Path $dir
          Copy-Item "build-arm64\Release\CampusAuthGuardian.exe" "$dir\"
          Copy-Item "README.md" "$dir\"
          Compress-Archive -Path "$dir\*" -DestinationPath "CampusAuthGuardian-windows-ARM64.zip" -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CampusAuthGuardian-windows-x64.zip
            CampusAuthGuardian-windows-ARM64.zip
          generate_release_notes: true
