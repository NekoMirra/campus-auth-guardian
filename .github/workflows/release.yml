name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
          - architecture: ARM64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-${{ matrix.architecture }} -G "Visual Studio 17 2022" -A ${{ matrix.architecture }}

      - name: Build
        run: cmake --build build-${{ matrix.architecture }} --config Release --target CampusAuthGuardian

      - name: Install
        run: cmake --install build-${{ matrix.architecture }} --config Release --prefix dist/${{ matrix.architecture }}

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/${{ matrix.architecture }}/* -DestinationPath release/CampusAuthGuardian-windows-${{ matrix.architecture }}.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusAuthGuardian-windows-${{ matrix.architecture }}
          path: release/CampusAuthGuardian-windows-${{ matrix.architecture }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          allow_updates: true
          files: release/*.zip
          generate_release_notes: true
