name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
          - architecture: ARM64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-${{ matrix.architecture }} -G "Visual Studio 17 2022" -A ${{ matrix.architecture }}

      - name: Build
        run: cmake --build build-${{ matrix.architecture }} --config Release --target CampusAuthGuardian

      - name: Upload native exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusAuthGuardian-${{ matrix.architecture }}
          path: build-${{ matrix.architecture }}/Release/CampusAuthGuardian.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*/*.exe
          generate_release_notes: true
