name: Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rust-target: x86_64-pc-windows-msvc
            msbuild-platform: x64
          - platform: ARM64
            rust-target: aarch64-pc-windows-msvc
            msbuild-platform: ARM64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Rust ${{ matrix.rust-target }}
        run: |
          rustup target add ${{ matrix.rust-target }}
          rustc --version

      - name: Rust unit tests (x64 only)
        if: matrix.platform == 'x64'
        run: cargo test --workspace

      - name: Build Rust core
        run: cargo build --release --target ${{ matrix.rust-target }} -p guardian-core

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build WinUI3 app (${{ matrix.platform }})
        run: msbuild csharp\CampusAuthGuardian.csproj /p:Configuration=Release /p:Platform=${{ matrix.msbuild-platform }} /restore /m /v:m /bl

      - name: Build installer (x64 only)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          # 收集 SelfContained 产物
          New-Item -ItemType Directory -Path "publish-x64" -Force | Out-Null
          Copy-Item "csharp/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64/*" "publish-x64/" -Recurse -Force
          # Inno Setup（runner 预装于 choco 路径；若无则装）
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          $ver = "${{ github.ref_name }}" -replace "^v", ""
          & $iscc /DMyAppVersion=$ver "installer/campus-auth-guardian.iss"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::ISCC failed"; exit 1 }
          Get-Item installer/*.exe | Select-Object Name, Length

      - name: Smoke test (x64 only, launch and verify alive)
        if: matrix.platform == 'x64'
        run: |
          $exe = "csharp\bin\x64\Release\net10.0-windows10.0.26100.0\win-x64\CampusAuthGuardian.exe"
          try {
            $p = Start-Process $exe -WorkingDirectory "csharp\bin\x64\Release\net10.0-windows10.0.26100.0\win-x64" -PassThru -ErrorAction Stop
            Start-Sleep 10
            if ($p.HasExited) { Write-Host "::warning::App exited early (headless env may block GUI)" }
            else { Write-Host "App running OK"; Stop-Process -Id $p.Id -Force }
          } catch {
            # headless CI 无交互桌面：GUI 启动失败不阻塞发布（本地已验证）
            Write-Host "::warning::GUI launch unavailable in headless runner: $($_.Exception.Message)"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusAuthGuardian-${{ matrix.platform }}
          path: |
            csharp/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.26100.0/win-${{ matrix.platform }}/**
            installer/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts (separate dirs)
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: false

      - name: Zip per-platform
        shell: pwsh
        run: |
          # merge-multiple:false → release/CampusAuthGuardian-x64/ 与 release/CampusAuthGuardian-ARM64/
          Compress-Archive -Path "release/CampusAuthGuardian-x64/*" -DestinationPath "CampusAuthGuardian-windows-x64.zip" -Force
          Compress-Archive -Path "release/CampusAuthGuardian-ARM64/*" -DestinationPath "CampusAuthGuardian-windows-ARM64.zip" -Force
          # setup.exe 独立资产（merge 后在 x64 目录）
          if (Test-Path "release/CampusAuthGuardian-x64/CampusAuthGuardian-setup-x64-*.exe") {
            Copy-Item "release/CampusAuthGuardian-x64/CampusAuthGuardian-setup-x64-*.exe" .
          }
          Get-Item *.zip, *.exe -ErrorAction SilentlyContinue | Select-Object Name, Length

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CampusAuthGuardian-windows-x64.zip
            CampusAuthGuardian-windows-ARM64.zip
            CampusAuthGuardian-setup-x64-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
